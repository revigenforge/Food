<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4d8d0">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Sweetly Yours by Zeen · Home of the OG Cookie Pie</title>
  <meta name="description" content="Sweetly Yours by Zeen: home of the OG Cookie Pie. Gooey cookie pies, cakes and handcrafted chocolates, baked fresh to order in Chennai and Bengaluru.">
  <meta property="og:title" content="Sweetly Yours by Zeen">
  <meta property="og:description" content="Your sweetest little escape. Home of the OG Cookie Pie.">
  <meta property="og:image" content="assets/img/og-cookie-pie-full.jpg">
</head>
<body data-page="landing">
  <main class="landing">
    <div class="landing__card">
      <img class="landing__logo" src="assets/img/logo.png" alt="Sweetly Yours logo">
      <h1 class="landing__name">Sweetly Yours</h1>
      <div class="landing__by">by Zeen</div>
      <p class="landing__tagline">Your sweetest little escape · Home of the OG Cookie Pie</p>
      <div class="landing__social">
        <a class="circle-btn" data-ig data-icon="instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram"></a>
        <a class="circle-btn" data-icon="image" href="gallery.html" aria-label="Gallery"></a>
      </div>
      <div class="city-switch" role="group" aria-label="Choose your city"></div>
    </div>

    <nav class="mode-list" aria-label="How would you like your order?">
      <a class="mode-btn mode-btn--outline" data-mode="pickup" data-icon="bag" href="menu.html">Self Pick-up</a>
      <a class="mode-btn mode-btn--soft" data-mode="delivery" data-icon="truck" href="menu.html">Get it Delivered <span class="pill">Within city</span></a>
      <a class="mode-btn mode-btn--primary" data-mode="gift" data-icon="gift" href="menu.html">Send as a Gift</a>
    </nav>
    <p class="landing__note">Baked fresh to order · Please order a day in advance</p>
  </main>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
