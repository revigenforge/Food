<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4d8d0">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Menu · Sweetly Yours by Zeen</title>
  <meta name="description" content="Order the OG Cookie Pie, cookie pots, Caramel Crunch Cake and handcrafted chocolates from Sweetly Yours by Zeen.">
</head>
<body data-page="menu">
  <header class="topbar">
    <div class="topbar__inner">
      <div class="topbar__row">
        <a class="brand" href="index.html" aria-label="Sweetly Yours home">
          <img src="assets/img/logo.png" alt="">
          <span class="brand__text"><span class="brand__name">Sweetly Yours</span><span class="brand__by">by Zeen</span></span>
        </a>
        <a class="head-btn head-btn--outline" data-icon="image" href="gallery.html"><span class="lbl">Gallery</span></a>
        <a class="head-btn" data-ig data-icon="instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram"></a>
        <button class="head-btn" type="button" data-open-cart data-icon="cart" aria-label="Open cart"><span class="badge-count hidden" data-cart-count>0</span></button>
      </div>
      <div class="search-row">
        <label class="search" data-icon="search">
          <input id="search" type="search" placeholder="Search treats…" autocomplete="off" aria-label="Search the menu">
        </label>
        <div class="filter-wrap">
          <button class="filter-btn" type="button" data-icon="filter" aria-label="Sort" aria-expanded="false"></button>
          <div class="filter-menu hidden" role="menu">
            <p>Sort by</p>
            <button type="button" role="menuitemradio" data-sort="recommended" aria-checked="true">Recommended</button>
            <button type="button" role="menuitemradio" data-sort="low" aria-checked="false">Price: low to high</button>
            <button type="button" role="menuitemradio" data-sort="high" aria-checked="false">Price: high to low</button>
          </div>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="Categories"></nav>
    </div>
  </header>

  <main class="container">
    <div class="slider">
      <div class="slides"></div>
      <div class="dots"></div>
    </div>

    <div class="mode-chip-row">
      <span class="mode-chip"></span>
      <a class="link" href="index.html">Change</a>
    </div>

    <div id="menu"></div>
  </main>

  <footer data-footer></footer>

  <button class="cart-bar hidden" type="button">
    <span class="cart-bar__info"></span>
    <span class="cart-bar__go" data-icon="right">View box</span>
  </button>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
